# valet — example config. Copy to config.toml (git-ignored) and edit.
# Easiest: `valet init <workspace_dir>` writes ~/.valet/config.toml for you.
#
# valet runs a command and returns its output with known secret VALUES scrubbed.
# v0.2 is permissive — it runs almost any command. Two control families:
#   [redaction] — command RUNS; its OUTPUT is scrubbed
#   [policy]    — decide whether the command RUNS AT ALL
#
# Which to reach for:
#   tool should USE a secret, agent shouldn't SEE it -> redaction.secret_file_paths
#   no tool should even RECEIVE a file               -> policy.deny_read (opt-in)
#   a program shouldn't run                          -> policy.deny_exec
# See "Choosing what to configure" in README.md for the full table.

[broker]
# Unix socket the daemon listens on (created 0600, owned by you — the OS is the
# access control; no port, token, or network surface).
socket_path = "~/.valet/broker.sock"

# Hard wall-clock limit per command (seconds).
timeout_seconds = 60

# Optional. Set for redaction tags stable across restarts; left as CHANGE_ME (or
# removed), valet generates an ephemeral salt at startup.
fingerprint_salt = "CHANGE_ME_or_run_valet_init"

[host]
# Level 1 trusted-LAN WebSocket host. Disabled unless lan = true. Use 127.0.0.1
# for local testing, or a LAN interface (e.g. 0.0.0.0) only on a trusted network.
id = "my-computer"
lan = false
listen = "127.0.0.1:8766"

# Client config lives in this same file: every command except `valet serve` reads
# [client] and [hosts.<name>] from here (override with -c / $VALET_CLIENT_CONFIG).
# With no [hosts], client commands use the local daemon over the Unix socket.
#
# [client]
# id = "my-computer"
# key = "<shared key approved under [identity.clients] on the host>"
# default_host = "my-computer"
# reconnect_max_retries = 5
# reconnect_backoff_seconds = 0.25
# reconnect_backoff_max_seconds = 3.0
#
# Name [hosts.<name>] after the host's [host].id and host_id defaults to it.
# [hosts.my-computer]
# url = "ws://192.168.1.25:8766/rpc"

[identity.clients]
# Approved Level 1 clients. Let valet manage this section:
#   valet clients add local-ai-box --url ws://192.168.1.25:8766/rpc
#   valet clients list / remove <id>
# Put the printed client snippet on the client machine, then `valet serve` here.
# `valet serve` reloads client changes automatically; restart only when changing
# [host].lan or [host].listen.

[audit]
# Optional newline-delimited JSON audit log (one object per line). Records
# metadata — caller, transport, command shape, policy decision, exit code,
# duration, redaction counts — never raw stdout/stderr or secret values.
log_path = "~/.valet/audit.jsonl"

# Also print each audit event to the server console (human-readable) under
# `valet serve` / `valet serve-lan`.
console = true

[exec]
# [exec], [policy], and [redaction] here are the DEFAULTS for every workspace;
# each [workspaces.<id>] can override any key.
#
# This config ships with NO workspace. Add your first after `valet init`:
#     valet workspaces add <id> <dir>
# `valet serve` refuses to start until one exists. default_workspace (used when a
# command names none) is managed by `valet workspaces add`, so it is left unset.
#   default_workspace = "<id>"

# Shell execution off by default. Enable only if you trust all clients and need
# pipes/globs/redirects/&&. Prefer `valet --env NAME=value run ...` for env vars.
shell = false

# Optional macOS OS sandbox: path to a sandbox-exec (.sb) profile. When set, every
# command runs under `sandbox-exec`, a real kernel boundary policy can't provide.
# Needs the workspace path set and `sandbox-exec` on PATH; a ready profile ships
# in contrib/sandbox-exec/workspace.sb. Leave unset to run without an OS sandbox.
#   sandbox_profile = "~/.valet/workspace.sb"

# Every command's env includes VALET_WORKSPACE = the workspace root, so you can
# reference workspace files from any subdirectory without ../../.. paths.
# [exec.env] sets default env vars for every command ($VALET_WORKSPACE expands);
# per-command env (inline `NAME=value` or --env) wins.
#   [exec.env]
#   AWS_SHARED_CREDENTIALS_FILE = "$VALET_WORKSPACE/.config/aws/credentials"
#   AWS_CONFIG_FILE = "$VALET_WORKSPACE/.config/aws/config"
#   GIT_CONFIG_GLOBAL="$VALET_WORKSPACE/.config/git/.gitconfig"
#   GH_CONFIG_DIR="$VALET_WORKSPACE/.config/gh"
#   GH_TOKEN="ghp_xxxx"
#   GOOGLE_WORKSPACE_CLI_CONFIG_DIR = "$VALET_WORKSPACE/.config/gws"
#   GOOGLE_WORKSPACE_CLI_KEYRING_BACKEND = "file"
#   ...

# ==== WORKSPACES =============================================================
# A workspace is a dedicated directory commands are confined to, and the REPL's
# cd jail: `cd` cannot climb above it (.. and symlinks resolved first). It appears
# as the virtual root "./", and the real parent path is stripped from all output.
# A `bin/` at the root is prepended to PATH.
#
# Point each workspace at a project directory, NOT your home ("~" would expose
# your whole home — the workspace is the blast radius).
#
# Add with the CLI (recommended); each `add` writes a section and scaffolds the
# directory (bin/, tools/, skills/, projects/, tmp/, README.md):
#     valet workspaces add work ~/work/project     # first one becomes default
#     valet workspaces add personal ~/personal --make-default
#     valet workspaces list
#
# Per-key overrides of the [exec]/[policy]/[redaction] defaults go in sub-tables:
#   [workspaces.personal]
#   path = "~/personal"
#   [workspaces.personal.exec]
#   shell = true
#   [workspaces.personal.policy]
#   deny_exec = ["rm"]
#   [workspaces.personal.redaction]
#   extra_values = ["a-token-only-this-workspace-uses"]

[redaction]
# ==== FAMILY 1: scrub OUTPUT (the command still runs) ====
#
# secret_file_paths: globs (** / * / ?) naming secret files/dirs that trusted
# commands legitimately USE; their contents are masked from EVERY command's
# output. ABSOLUTE / ~-rooted patterns match the filesystem (apply everywhere);
# RELATIVE ones resolve against each command's cwd. A pattern may name a file, a
# directory (all files under it), or a glob. For each match valet masks the whole
# file content (so any full dump is caught) plus its structured values (KEY=VALUE
# / ini / json / yaml). Missing paths skipped; files >1 MB skip the whole-blob
# step.
#
# NOTE the leading "**/" on the relative patterns: a bare ".secrets/**" matches
# ONLY a .secrets/ directory at the cwd, so a nested one (e.g.
# skills/foo/.secrets/token) would NOT be covered and its contents would leak.
# "**/.secrets/**" matches .secrets/ at any depth. The "**/" walks the tree per
# command, so for a huge workspace prefer listing the specific subtrees instead.
secret_file_paths = [
    "~/.aws/**", "~/.config/**",
    "**/.env", "**/.config/**", "**/.secrets/**", "**/secrets/**",
    "**/.passwords/**", "**/passwords/**", "**/.ssh/**", "**/.aws/**",
]

# Extra literal strings to always redact (e.g. a token not stored in a file).
extra_values = []

# Mask values that *look* secret even when valet doesn't know the exact value
# (e.g. fetched at runtime). Covers the value of a sensitively-named key, the
# `value:` of a key/value pair, and known token shapes (AWS/GitHub/Slack/Stripe/
# Google, JWT, PEM). Key names stay visible. Set false to keep output verbatim.
redact_suspected = true

# OFF by default, noisy: mask long high-entropy tokens ANYWHERE, even a bare
# string with no key name or known shape. Skips git SHAs/hashes, UUIDs, decimal
# ids, and paths, but may still mask base64 blobs or random-looking non-secrets.
redact_high_entropy = false

[policy]
# ==== FAMILY 2: block EXECUTION (decide whether a command runs) ====
#
# PERMISSIVE by default except valet's built-in bans (env/process/system control
# like env/kill/sudo/reboot, shells when [exec].shell=false, and valet itself).
# Inspect/stop subprocesses with `valet processes list` / `kill <pid>`.
#
# Command-line policy is best-effort static analysis, not a real boundary — for a
# hard guarantee use the OS sandbox (see contrib/sandbox-exec/).
#
# allow_exec: empty = allow everything not otherwise denied. A non-empty list
# flips to DEFAULT-DENY: only these basenames run (cd/pushd/popd still allowed),
# e.g. allow_exec = ["python", "ls", "cat"].
allow_exec = []

# deny_exec: extra program-name bans (by basename) on top of the built-ins,
# e.g. deny_exec = ["rm", "npm"].
deny_exec = []

# deny_read: globs of files a command may not name — valet refuses to RUN it. A
# HARD block that also stops a trusted tool from USING the file (`mytool --creds
# .env`), the opposite of what valet is for; redaction (FAMILY 1) is the usual
# answer and already covers secret files via secret_file_paths, so this is EMPTY
# by default. Use it only for files no tool should even receive — where you'd
# rather the command fail than trust redaction (which can't follow a value that is
# transformed, e.g. base64-encoded, before printing). Shell-aware: splits on
# ; && || | and tracks cd. Examples: "**/.env", "**/.secrets/**", "~/.aws/**".
deny_read = []

# DEFAULT ON. Refuse a command whose existing path argument or cwd resolves
# outside [exec].workspace (../ and symlinks included). Best-effort, not a sandbox.
enforce_workspace_reads = true

# DEFAULT ON. Refuse a command whose path-like argument resolves outside the
# workspace even if it doesn't exist yet, so nothing is written outside.
enforce_workspace_writes = true
