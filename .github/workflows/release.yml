name: release

# Push a version tag (e.g. `git tag v0.0.1 && git push origin v0.0.1`) to build
# and publish to PyPI via Trusted Publishing (OIDC) — no API token in the repo.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
