[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "valet-ai"
version = "0.0.2"
description = "A local secret-redacting command runner: run a command, get output with secrets scrubbed."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml>=6"]
keywords = ["security", "secrets", "redaction", "agents", "llm", "sandbox", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Security",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/anelendata/valet"
Repository = "https://github.com/anelendata/valet"
Issues = "https://github.com/anelendata/valet/issues"

[project.scripts]
valet = "valet.cli:main"

[tool.setuptools.packages.find]
include = ["valet*"]

[tool.setuptools.package-data]
# Ship the example config and the macOS sandbox profile inside the wheel so
# `valet init` finds them when installed (not just from a source checkout).
valet = ["config.example.toml", "workspace.sb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
