[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "valet"
version = "0.1.0"
description = "A local secret-redacting command runner: run a command, get output with secrets scrubbed."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
# Zero required third-party deps — only the standard library. YAML value
# extraction is an optional extra (see [project.optional-dependencies].yaml);
# without it, YAML secret files are still redacted whole-file.
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
test = ["pytest>=7", "pyyaml>=6"]

[project.scripts]
valet = "valet.cli:main"

[tool.setuptools.packages.find]
include = ["valet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
