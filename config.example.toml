# valet — example config. Copy to config.toml (git-ignored) and edit.
#
#   cp config.example.toml config.toml
#   valet init            # (optional) generate a stable fingerprint_salt
#
# valet is a secret-redacting command runner: it runs a command and returns the
# output with known secret VALUES scrubbed out. v0.2 is intentionally
# permissive — it will run (almost) any command.
#
# Two families of controls do fundamentally different things:
#   [redaction] — let the command RUN, scrub its OUTPUT (masks content)
#   [policy]    — decide whether the command RUNS AT ALL (blocks execution)
#
# Rule of thumb:
#   "a command should be able to USE this file"  -> redaction.secret_sources
#                                                   / redaction.cwd_secret_files
#   "no one should SEE this file"                -> policy.deny_read_paths
#   "this program shouldn't run"                 -> policy.deny
# See the "Choosing what to configure" section in README.md for the full table.

[broker]
# Unix-domain-socket the daemon listens on. Created 0600, owned by you, so the
# OS is the access-control layer — no port, no token, no network surface.
socket_path = "~/.valet/broker.sock"

# Hard wall-clock limit per command (seconds).
timeout_seconds = 60

# Optional. If set, redaction tags are stable across restarts. If left as
# CHANGE_ME (or removed), valet generates an ephemeral salt at startup.
fingerprint_salt = "CHANGE_ME_or_run_valet_init"

[http]
# Optional HTTP adapter for clients that cannot speak Unix-domain sockets.
# It is disabled unless you run `valet serve-http`, and every request must send:
#   Authorization: Bearer <bearer_token>
#
# Bind to loopback by default. Change this only when you deliberately want
# another interface exposed.
host = "127.0.0.1"
port = 8765

# Required for `valet serve-http`. Generate a long random value, keep it in your
# git-ignored config.toml, and do not put it in prompts or logs.
bearer_token = "CHANGE_ME_to_a_long_random_token"

[host]
# Level 1 trusted-LAN WebSocket RPC host settings. The LAN listener is disabled
# unless lan = true. Bind to 127.0.0.1 for local testing, or deliberately choose
# a LAN interface such as 0.0.0.0 only on a trusted network.
id = "my-main-laptop"
lan = false
listen = "127.0.0.1:8766"

# Client-only config.toml also supports reconnect tuning for WebSocket hosts:
#
# [client]
# reconnect_max_retries = 5
# reconnect_backoff_seconds = 0.25
# reconnect_backoff_max_seconds = 3.0
#
# The same keys can be set under [hosts.<name>] to override one host.

[identity.clients]
# Approved Level 1 clients go here. Let valet generate and update this section:
#   valet clients add local-ai-box --url ws://192.168.1.25:8766/rpc
#   valet clients list
#   valet clients remove local-ai-box
# Then put the printed client-only TOML snippet on the client machine and run
# `valet serve` on this host.
#
# `valet serve` reloads changes to approved clients automatically. Restart only
# when changing listener bind settings such as [host].lan or [host].listen.

[audit]
# Optional newline-delimited JSON audit log. Each line is one JSON object, so
# the server can append safely without rewriting the whole file.
#
# The audit log records metadata such as caller, transport, command shape,
# policy decision, exit code, duration, and redaction counts. It does not store
# raw stdout/stderr or known secret values.
log_path = "~/.valet/audit.jsonl"

# When running `valet serve` or `valet serve-http`, also print each audit event
# to the server console in a human-readable logging style.
console = true

[exec]
# Default working directory for commands, and the root of the REPL's cd jail:
# in the interactive shell `cd` sticks for the session but cannot climb above
# this directory (.. and symlinks are resolved first). Leave unset to use the
# daemon's own working directory and impose no cd jail.
#
# When set, the workspace is presented as a virtual root: it appears as "/" (a
# child as "/child"), and the real parent path is stripped from all output
# during redaction, so `pwd` and any command that prints an absolute path under
# the workspace never disclose the directories above it.
workspace = "~"

# Shell execution is disabled by default. Leave this false unless you trust all
# clients of this host and need shell syntax such as pipes, globs, redirects, or
# `&&`. Prefer `valet --env NAME=value run ...` for per-command env vars.
shell = false

# Optional OS sandbox (macOS). Path to a sandbox-exec (.sb) profile; when set,
# every command is run as `sandbox-exec -D WORKSPACE=<workspace> -f <profile>
# <command>`, a real kernel boundary that command-line policy cannot provide.
# Requires [exec].workspace, and `sandbox-exec` on PATH. A ready profile ships
# in contrib/sandbox-exec/workspace.sb — copy it somewhere stable and point here.
# Leave unset to run commands without an OS sandbox.
#   sandbox_profile = "~/.valet/workspace.sb"

[redaction]
# ==== FAMILY 1: scrub OUTPUT — the command still runs, its output is masked ====
#
# secret_sources: fixed secret files (by ABSOLUTE path) that trusted commands
# legitimately USE. Masked in EVERY command's output no matter where it runs.
# For each, valet redacts:
#   1. the ENTIRE file content as one blob — so `cat`/`less`/any full dump of the
#      file is masked wholesale, regardless of format (ini, .env, JSON, a bare
#      token, a PEM key, ...); and
#   2. the individual structured values (KEY=VALUE / ini / json) — so a single
#      secret leaking on its own (e.g. `echo $KEY`) is caught even without the
#      surrounding file.
# Missing files are skipped. Files over ~1 MB skip the whole-blob step but are
# still parsed for values.
secret_sources = [
    "~/.aws/credentials",
    "~/.aws/config",
]

# cwd_secret_files: like secret_sources but by FILENAME, auto-loaded from each
# command's working directory — so a project's own .env/.secrets are redacted
# when you run there, without listing every project. One line covers all of them.
cwd_secret_files = [".env", ".secrets"]

# Extra literal strings to always redact (e.g. a token not stored in a file).
extra_values = []

# Heuristically mask values that *look* secret, even when valet does not know
# the exact value (e.g. secrets a command fetched from a parameter store at
# runtime, like `handoff secrets print`). On by default. It masks:
#   - the VALUE of an assignment whose KEY name looks sensitive
#     (password / secret / token / api_key / credential / auth / ...),
#   - the `value:` field of a key:/value: object pair (secrets-dump format), and
#   - known token shapes (AWS/GitHub/GitLab/Slack/Stripe/Google, JWT, PEM).
# The key name stays visible; only the value is masked. Set to false to keep
# output verbatim.
redact_suspected = true

# OFF by default and noisy: mask long high-entropy tokens ANYWHERE in output,
# even a bare string with no key name or known shape (e.g. a token a command
# just prints on its own). It skips git SHAs / hashes (hex), UUIDs, decimal ids,
# and filesystem paths, but will still sometimes mask base64 blobs or random-
# looking IDs that are not secrets. Enable per environment if you need it.
redact_high_entropy = false

[policy]
# ==== FAMILY 2: block EXECUTION — decide whether the command runs at all ====
#
# PERMISSIVE by default except for Valet's built-in dangerous command bans:
# environment/process/system-control commands such as env/printenv/kill/pkill/
# killall/ps/sudo/reboot, common shell executables when [exec].shell=false, and
# valet itself. Use `valet processes list` and `valet processes kill <pid>` to
# inspect or stop subprocesses started by Valet.
#
# Everything below is additional local policy.
#
# Command-line policy is best-effort static analysis, not a real boundary: a
# determined client can compute paths or use tools that read/write internally.
# For a hard guarantee, run commands under an OS sandbox — see
# contrib/sandbox-exec/ for a macOS prototype.
#
# An empty allow list means "allow everything not otherwise denied". Set a
# non-empty list to switch to DEFAULT-DENY: only these command basenames may run
# (cd/pushd/popd stay available for navigation). Strongest posture; opt in when
# you know the exact tools the client needs, e.g. allow = ["python", "ls", "cat"].
allow = []

# Additional program-name deny list (matched on the command's basename), on top
# of the built-in dangerous-command bans. Use to forbid a whole tool, e.g.
# deny = ["rm", "npm"].
deny = []

# deny_read_paths: glob patterns of files a command may not reference — valet
# refuses to run a command that names an existing matching file, so its content
# is never revealed. Use this to flatly forbid DISPLAYING a file (cat/less/grep);
# it is all-or-nothing, and only catches files named on the command line.
# (Contrast with redaction.secret_sources above, which lets the command run and
# scrubs the output — use that for files trusted tools must USE.)
# The analyzer is shell-aware: it splits on ; && || | and tracks cd, so
# `cd dir; cat .env` is caught the same as `cat dir/.env`.
# Supports ** (any depth), * and ?. Examples:
#   "**/.env"          ban reading any .env, wherever it sits
#   "**/.secrets/**"   ban anything under any .secrets directory
#   "~/.aws/**"        ban anything under ~/.aws
deny_read_paths = [
    # "**/.env",
    # "**/.secrets/**",
    # "~/.aws/**",
]

# DEFAULT ON. Refuse a command whose existing file/directory arguments, or
# requested cwd, resolve outside [exec].workspace — including ../ paths and
# symlinks that point outside. Best-effort command-line analysis, not an OS
# sandbox: a command can still compute or open a path internally.
enforce_workspace_reads = true

# DEFAULT ON. Refuse a command whose path-like argument (absolute, ~-rooted, or
# containing a separator) resolves outside the workspace, even if it does not
# exist yet — so a new file cannot be written outside. Same best-effort caveat.
enforce_workspace_writes = true
